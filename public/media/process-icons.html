<!DOCTYPE html>
<html>
<head>
  <title>Icon Processor V2</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    #log { white-space: pre-wrap; font-size: 13px; max-height: 400px; overflow-y: auto; }
    #preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    #preview .icon-box { 
      width: 80px; height: 80px; 
      background: repeating-conic-gradient(#444 0% 25%, #555 0% 50%) 50% / 16px 16px;
      border: 1px solid #333; border-radius: 4px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #preview .icon-box img { width: 100%; height: 100%; object-fit: contain; }
    .label { color: #888; font-size: 10px; text-align: center; width: 80px; overflow: hidden; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>
  <h2>3D Icon Background Remover V2</h2>
  <p style="color:#888">Loads local raw_*.webp files, removes backgrounds, outputs base64 WebP data.</p>
  <button id="startBtn" onclick="startProcessing()">Start Processing</button>
  <div id="log"></div>
  <div id="preview"></div>
  <textarea id="output" style="width:100%;height:200px;display:none;margin-top:20px;font-size:10px;background:#222;color:#0f0;border:1px solid #333;"></textarea>

  <script>
    const TOTAL = 30;
    const logEl = document.getElementById('log');
    const previewEl = document.getElementById('preview');
    const outputEl = document.getElementById('output');
    
    // Store all results here for extraction by JS execution
    window.__results = {};
    window.__processingComplete = false;

    function log(msg) {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed: ' + url));
        img.src = url;
      });
    }

    function removeBackground(img) {
      const canvas = document.createElement('canvas');
      const size = 400;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      ctx.drawImage(img, 0, 0, size, size);
      
      const imageData = ctx.getImageData(0, 0, size, size);
      const data = imageData.data;
      
      // Sample corner pixels to detect bg color
      const corners = [];
      const s = 8;
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          let idx = (y * size + x) * 4;
          corners.push([data[idx], data[idx+1], data[idx+2]]);
          idx = (y * size + (size - 1 - x)) * 4;
          corners.push([data[idx], data[idx+1], data[idx+2]]);
          idx = ((size - 1 - y) * size + x) * 4;
          corners.push([data[idx], data[idx+1], data[idx+2]]);
          idx = ((size - 1 - y) * size + (size - 1 - x)) * 4;
          corners.push([data[idx], data[idx+1], data[idx+2]]);
        }
      }
      
      let bgR = 0, bgG = 0, bgB = 0;
      for (const [r, g, b] of corners) { bgR += r; bgG += g; bgB += b; }
      bgR = Math.round(bgR / corners.length);
      bgG = Math.round(bgG / corners.length);
      bgB = Math.round(bgB / corners.length);
      
      log(`    bg color: rgb(${bgR}, ${bgG}, ${bgB})`);
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const dr = r - bgR, dg = g - bgG, db = b - bgB;
        const dist = Math.sqrt(dr*dr + dg*dg + db*db);
        
        const threshold = 30;
        const feather = 50;
        
        if (dist < threshold) {
          data[i+3] = 0;
        } else if (dist < threshold + feather) {
          const t = (dist - threshold) / feather;
          const alpha = Math.round(t * 255);
          data[i+3] = Math.min(data[i+3], alpha);
          if (alpha > 0) {
            const f = alpha / 255;
            data[i]   = Math.min(255, Math.max(0, Math.round((r - bgR * (1-f)) / f)));
            data[i+1] = Math.min(255, Math.max(0, Math.round((g - bgG * (1-f)) / f)));
            data[i+2] = Math.min(255, Math.max(0, Math.round((b - bgB * (1-f)) / f)));
          }
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
      return canvas;
    }

    async function startProcessing() {
      document.getElementById('startBtn').disabled = true;
      log('Starting icon processing (V2 - local files)...');
      log('---');
      
      let processed = 0;
      
      for (let i = 1; i <= TOTAL; i++) {
        const url = `/images/cursor/raw_${i}.webp`;
        const filename = `icon_${i}.webp`;
        
        try {
          log(`[${i}/${TOTAL}] Loading raw_${i}.webp...`);
          const img = await loadImage(url);
          
          log(`  → Removing background...`);
          const canvas = removeBackground(img);
          
          // Get base64 WebP data
          const dataUrl = canvas.toDataURL('image/webp', 0.90);
          const base64 = dataUrl.split(',')[1];
          
          // Store result
          window.__results[i] = base64;
          
          // Show preview
          const wrapper = document.createElement('div');
          wrapper.style.display = 'inline-flex';
          wrapper.style.flexDirection = 'column';
          wrapper.style.alignItems = 'center';
          
          const box = document.createElement('div');
          box.className = 'icon-box';
          const previewImg = document.createElement('img');
          previewImg.src = dataUrl;
          box.appendChild(previewImg);
          
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = filename;
          
          wrapper.appendChild(box);
          wrapper.appendChild(label);
          previewEl.appendChild(wrapper);
          
          const sizeKB = (base64.length * 0.75 / 1024).toFixed(1);
          log(`  ✓ ${filename} ready (~${sizeKB} KB)`);
          processed++;
        } catch (err) {
          log(`  ✗ ${err.message}`);
        }
      }
      
      log('---');
      log(`Done! ${processed}/${TOTAL} icons processed.`);
      window.__processingComplete = true;
      window.__processedCount = processed;
      
      log('Results stored in window.__results');
      log('Use: window.__results[1] to get base64 of icon_1.webp');
    }
  </script>
</body>
</html>
